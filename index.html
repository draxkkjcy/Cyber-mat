


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER M.A.T - LOGIN</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .terminal {
            width: 90%;
            max-width: 500px;
            background: #050505;
            border: 1px solid #00ff00;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            border-radius: 5px;
        }
        h1 { 
            font-size: 1.6rem; 
            text-align: center; 
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .input-group {
            margin-top: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
        }
        input {
            background: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: inherit;
            font-size: 1rem;
            width: 95%;
            padding: 10px;
            outline: none;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 12px 20px;
            margin-top: 20px;
            font-family: inherit;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            letter-spacing: 1px;
        }
        button:hover { 
            background: #00cc00; 
        }
        .resultado { 
            margin-top: 25px; 
            white-space: pre-wrap; 
            font-weight: bold;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="terminal">
    <h1>=== CYBER M.A.T ===</h1>
    <p>> CYBWR ON</p>
    <p>> click here . . .</p>
    
    <div class="input-group">
        <label for="senha">tip: pessoa que voce ama:</label>
        <input type="text" id="senha" placeholder="Digite a resposta aqui..." autocomplete="off">
    </div>
    
    <button onclick="verificarAcesso()">EXECUTAR EXPLOIT</button>
    
    <div id="display" class="resultado"></div>
</div>

<script>
    // LISTA DE SENHAS ATUALIZADA
    const senhasValidas = ["drax", "fernanda", "cyber", "hamishi"];

    function verificarAcesso() {
        const campoSenha = document.getElementById("senha");
        const entrada = campoSenha.value;
        const display = document.getElementById("display");
        
        // trim() remove espaços extras e toLowerCase() deixa tudo minúsculo
        const senhaLimpa = entrada.trim().toLowerCase();

        if (senhasValidas.includes(senhaLimpa)) {
            display.style.color = "#00ff00";
            display.innerText = "\n[ACCESS ACCEPTED]\n\noi minha gatinha rs\nEsse sistema foi desenvolvido especialmente para voce. S2";
        } else {
            display.style.color = "#ff0000";
            display.innerText = "\n[ACCESS DENIED]\nTentativa bloqueada pelo firewall da CYBER M.A.T.";
        }
    }
</script>

</body>
</html>
